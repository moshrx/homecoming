<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HOME COMING</title>
<meta name="description" content="Charlottetown to Kochi — 18 September, 16:00 Atlantic." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#07070E;
    --midnight:#0E1330;
    --red:#E01B2B;
    --blue:#2A4FE0;
    --paper:#F0F2F7;
    --dim:rgba(240,242,247,.52);
    --hair:rgba(240,242,247,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--night);
    color:var(--paper);
    font-family:"Barlow Condensed",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #backdrop{
    position:fixed;inset:0;
    background-size:cover;background-position:center;
    filter:saturate(.85) contrast(1.05);
    opacity:0;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  main{
    position:relative;height:100%;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:max(18px,env(safe-area-inset-top)) clamp(18px,4vw,42px) max(18px,env(safe-area-inset-bottom));
  }

  /* --- top bar --- */
  .bar{
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    font-size:clamp(11px,1.7vw,13px);
    letter-spacing:.16em;text-transform:uppercase;
  }
  .route{
    color:var(--paper);font-weight:600;
    border-left:3px solid var(--red);padding-left:10px;line-height:1.35;
  }
  .route small{display:block;color:var(--dim);font-weight:400;letter-spacing:.22em;font-size:.82em}
  .here{text-align:right;color:var(--dim);line-height:1.35}
  .here b{display:block;color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}

  /* --- centre --- */
  .core{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(22px,5vh,46px);text-align:center;
  }
  h1{
    font-family:"Bungee",Impact,sans-serif;font-weight:400;
    font-size:clamp(44px,12.5vw,132px);
    line-height:.86;letter-spacing:.01em;
  }
  h1 .l1{display:block;color:var(--paper);text-shadow:2px 0 var(--blue),-2px 0 var(--red)}
  h1 .l2{display:block;color:var(--red);text-shadow:2px 0 var(--midnight),-2px 0 var(--blue)}

  .clock{display:flex;gap:clamp(8px,2.2vw,20px)}
  .unit{
    background:rgba(7,7,14,.55);
    border:1px solid rgba(224,27,43,.42);
    clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
    padding:clamp(10px,2vw,18px) clamp(10px,2.4vw,24px);
    min-width:clamp(64px,15vw,124px);
    backdrop-filter:blur(3px);
  }
  .num{
    display:block;
    font-family:"Bungee",Impact,sans-serif;
    font-size:clamp(28px,7.4vw,68px);line-height:1;
    color:var(--paper);font-variant-numeric:tabular-nums;
  }
  .cap{
    display:block;margin-top:8px;
    font-size:clamp(9px,1.5vw,11px);letter-spacing:.28em;
    text-transform:uppercase;color:var(--red);font-weight:600;
  }

  /* --- bottom --- */
  .foot{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    font-size:clamp(10px,1.6vw,12.5px);letter-spacing:.15em;
    text-transform:uppercase;color:var(--dim);
  }
  .foot b{color:var(--paper);font-weight:600}
  .foot .r{text-align:right}

  .arrived{display:none;font-family:"Bungee",sans-serif;font-size:clamp(20px,4.4vw,38px);color:var(--red)}
  body.landed .clock{display:none}
  body.landed .arrived{display:block}

  .fade{opacity:0;transform:translateY(12px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.1s}.d2{animation-delay:.28s}.d3{animation-delay:.5s}.d4{animation-delay:.72s}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (max-width:520px){
    .bar{flex-direction:column;align-items:flex-start}
    .here{text-align:left}
    .foot{flex-direction:column;align-items:flex-start;gap:6px}
    .foot .r{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="backdrop"></div>
<canvas id="gl" aria-hidden="true"></canvas>

<main>
  <header class="bar fade d1">
    <div class="route">Charlottetown &rarr; Kochi<small>YYG &middot; COK</small></div>
    <div class="here">Where you are<b id="place">&mdash;</b><b id="localnow">&mdash;</b></div>
  </header>

  <section class="core">
    <h1 class="fade d2"><span class="l1">HOME</span><span class="l2">COMING</span></h1>

    <div class="clock fade d3" role="timer">
      <div class="unit"><span class="num" id="d">--</span><span class="cap">Days</span></div>
      <div class="unit"><span class="num" id="h">--</span><span class="cap">Hrs</span></div>
      <div class="unit"><span class="num" id="m">--</span><span class="cap">Min</span></div>
      <div class="unit"><span class="num" id="s">--</span><span class="cap">Sec</span></div>
    </div>
    <p class="arrived fade d3">WHEELS UP</p>
  </section>

  <footer class="foot fade d4">
    <div>Departs <b>18 Sept 2026 &middot; 16:00 Atlantic</b></div>
    <div class="r">In your time <b id="localtarget">&mdash;</b></div>
  </footer>
</main>

<script>
/* Optional: paste a URL to an image you own or are licensed to use. */
const BACKDROP = "";

if (BACKDROP){
  const b = document.getElementById("backdrop");
  b.style.backgroundImage = `url("${BACKDROP}")`;
  b.style.opacity = ".38";
}

/* ---------- fixed departure instant ---------- */
const TARGET = new Date("2026-09-18T16:00:00-03:00").getTime();
const ORIGIN = new Date("2026-08-02T00:00:00-03:00").getTime();
const pad = n => String(n).padStart(2,"0");

const D=document.getElementById("d"), H=document.getElementById("h"),
      M=document.getElementById("m"), S=document.getElementById("s"),
      PLACE=document.getElementById("place"),
      NOW=document.getElementById("localnow"),
      LTARGET=document.getElementById("localtarget");

/* ---------- viewer's own place + clock ---------- */
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
const city = tz ? tz.split("/").pop().replace(/_/g," ") : "Unknown";
const offMin = -new Date().getTimezoneOffset();
const offset = (offMin >= 0 ? "+" : "-") +
  pad(Math.floor(Math.abs(offMin)/60)) + ":" + pad(Math.abs(offMin)%60);
PLACE.textContent = city + " (UTC" + offset + ")";

LTARGET.textContent = new Date(TARGET).toLocaleString(undefined,{
  weekday:"short", day:"numeric", month:"short",
  hour:"2-digit", minute:"2-digit"
});

let progress = 0;

function tick(){
  const now = Date.now();

  NOW.textContent = new Date(now).toLocaleTimeString(undefined,{
    hour:"2-digit", minute:"2-digit", second:"2-digit"
  });

  const left = TARGET - now;
  progress = Math.min(1, Math.max(0, (now - ORIGIN)/(TARGET - ORIGIN)));

  if (left <= 0){
    document.body.classList.add("landed");
    progress = 1;
    return;
  }
  const sec = Math.floor(left/1000);
  D.textContent = pad(Math.floor(sec/86400));
  H.textContent = pad(Math.floor(sec/3600)%24);
  M.textContent = pad(Math.floor(sec/60)%60);
  S.textContent = pad(sec%60);
}
tick();
setInterval(tick, 1000);

/* ---------- webgl: the web tightens ---------- */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", {antialias:false, alpha:true});

if (!gl){
  document.body.style.background =
    "radial-gradient(120% 90% at 50% 45%, #16205A 0%, #07070E 65%)";
} else {
  const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
  const FS = `
  precision highp float;
  uniform vec2  u_res;
  uniform float u_time;
  uniform float u_prog;
  uniform vec2  u_par;

  #define PI 3.14159265

  const vec3 night = vec3(0.027,0.027,0.055);
  const vec3 deepb = vec3(0.055,0.075,0.188);
  const vec3 red   = vec3(0.878,0.106,0.169);
  const vec3 blue  = vec3(0.165,0.310,0.878);
  const vec3 silk  = vec3(0.941,0.949,0.969);

  float strand(float d, float w){ return smoothstep(w, 0.0, abs(d)); }

  void main(){
    vec2 p = (gl_FragCoord.xy - 0.5*u_res)/u_res.y;
    p += u_par * 0.035;
    p.y += 0.04;

    float r = length(p);
    float ang = atan(p.y, p.x) + sin(u_time*0.06)*0.05;

    float spokes = 16.0;
    float sect = 2.0*PI/spokes;
    float ai = mod(ang, sect) - sect*0.5;

    /* base wash: blue above, night below, red bloom behind the title */
    vec3 col = mix(night, deepb, smoothstep(-0.55, 0.85, p.y));
    col += red * 0.16 * exp(-r*r*3.2);
    col += blue * 0.10 * exp(-pow(r-0.85,2.0)*9.0);

    /* radial spokes */
    float sp = strand(ai*r, 0.0018 + r*0.0011);
    sp *= smoothstep(0.035, 0.09, r);

    /* rings, sagging inward between spokes */
    float rr = r * cos(ai) / cos(sect*0.5);
    float rings = 0.0;
    for (int i = 0; i < 10; i++){
      float k = float(i);
      float rad = 0.085 * pow(1.36, k);
      rings += strand(rr - rad, 0.0022 + rad*0.0009);
    }

    float web = clamp(sp + rings, 0.0, 1.0);
    web *= smoothstep(1.55, 0.35, r);
    col += silk * web * 0.20;
    col += blue * web * 0.10;

    /* the tightening band — closes toward centre as the date nears */
    float band = mix(1.35, 0.02, u_prog);
    float g = exp(-pow(rr - band, 2.0) * 190.0);
    col += red * g * (0.30 + web * 1.5);

    /* halftone print texture */
    vec2 hp = gl_FragCoord.xy / (u_res.y * 0.014);
    float dots = length(fract(hp) - 0.5);
    col *= 1.0 - smoothstep(0.42, 0.5, dots) * 0.06;

    /* vignette + grain */
    col *= mix(0.42, 1.0, smoothstep(1.45, 0.2, length(p*vec2(0.78,1.0))));
    float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
    col += (n - 0.5) * 0.025;

    gl_FragColor = vec4(col, 1.0);
  }`;

  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,"a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes=gl.getUniformLocation(prog,"u_res"),
        uTime=gl.getUniformLocation(prog,"u_time"),
        uProg=gl.getUniformLocation(prog,"u_prog"),
        uPar=gl.getUniformLocation(prog,"u_par");

  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(innerWidth  * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  addEventListener("resize", resize);
  resize();

  /* parallax: pointer on desktop, tilt on mobile */
  let tx=0, ty=0, px=0, py=0;
  addEventListener("pointermove", e => {
    tx = (e.clientX/innerWidth - .5) * 2;
    ty = -(e.clientY/innerHeight - .5) * 2;
  });
  addEventListener("deviceorientation", e => {
    if (e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma/35));
    ty = Math.max(-1, Math.min(1, (e.beta - 45)/35));
  });

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = performance.now();

  function frame(now){
    px += (tx - px) * 0.05;
    py += (ty - py) * 0.05;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, still ? 0 : (now - t0)/1000);
    gl.uniform1f(uProg, progress);
    gl.uniform2f(uPar, px, py);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
